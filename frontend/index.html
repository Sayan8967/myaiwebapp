<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mount Sinai Health Systems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(45deg, #007BFF, #ffffff, #007BFF, #f5f5f5);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
      }
      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      h1 {
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        color: #007BFF;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
      }
      .subtitle {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 1rem;
      }
      .alert.success {
        --bs-alert-bg: var(--bs-success-bg-subtle);
        --bs-alert-border-color: var(--bs-success-border-subtle);
        --bs-alert-color: var(--bs-success-text-emphasis);
      }
      .alert.error {
        --bs-alert-bg: var(--bs-danger-bg-subtle);
        --bs-alert-border-color: var(--bs-danger-border-subtle);
        --bs-alert-color: var(--bs-danger-text-emphasis);
      }
      #response {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center my-5">Mount Sinai Health System</h1>
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-body">
              <p class="subtitle text-center">🩺 Health Hub Alert! What’s On Your Mind?</p>
              <textarea
                id="userQuery"
                class="form-control mb-3"
                placeholder="Type your query here..."
                rows="5"
                maxlength="500"
                aria-label="Query input"
              ></textarea>
              <button id="sendButton" type="button" class="btn btn-primary w-100 mb-2">Send Query</button>
              <button id="clearButton" type="button" class="btn btn-secondary w-100 mb-3">Clear</button>
              <div id="response" class="alert" role="alert" style="display: none;">
                <div class="d-flex justify-content-center">
                  <div class="spinner-border text-primary" id="loadingSpinner" role="status" style="display: none;">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                </div>
                <div id="responseText" class="mt-2"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <noscript>
      <p style="text-align: center; color: #f44336;">
        This application requires JavaScript to function. Please enable it in your browser.
      </p>
    </noscript>

    <script>
      // Configurable backend URL (injected via env or defaults to local)
      const BACKEND_URL = window.BACKEND_URL || "/api";

      document.getElementById("sendButton").addEventListener("click", async () => {
        const query = document.getElementById("userQuery").value.trim();
        const responseBox = document.getElementById("response");
        const responseText = document.getElementById("responseText");
        const loadingSpinner = document.getElementById("loadingSpinner");

        // Reset previous states
        responseBox.classList.remove("success", "error");

        if (!query) {
          alert("Please type a query.");
          return;
        }

        // Show response box and spinner
        responseBox.style.display = "block";
        loadingSpinner.style.display = "block";
        responseText.textContent = "";

        try {
          console.log(`Sending request to ${BACKEND_URL}/query`);
          
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 300000); // 5 min timeout

          const response = await fetch(`${BACKEND_URL}/query`, {
            method: "POST",
            headers: { 
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({ query }),
            signal: controller.signal,
            credentials: "same-origin"
          });

          clearTimeout(timeoutId);

          console.log("Response status:", response.status);
          
          if (!response.ok) {
            throw new Error(`Server responded with status ${response.status}`);
          }

          const data = await response.json();
          console.log("Response data:", data);
          
          responseText.innerHTML = (data.response || "No response received.").replace(/\n/g, "<br>");
          responseBox.classList.add("success");
        } catch (error) {
          console.error("Error details:", error);
          
          responseBox.classList.add("error");
          if (error.name === "AbortError") {
            responseText.textContent = "Request timed out. Please try again.";
          } else if (error.name === "TypeError" && error.message.includes("Failed to fetch")) {
            responseText.textContent = "Network error or CORS issue. Please check your connection.";
          } else {
            responseText.textContent = `Error: ${error.message}`;
          }
        } finally {
          loadingSpinner.style.display = "none";
        }
      });

      document.getElementById("clearButton").addEventListener("click", () => {
        document.getElementById("userQuery").value = "";
        const responseBox = document.getElementById("response");
        responseBox.style.display = "none";
        responseBox.classList.remove("success", "error");
        document.getElementById("responseText").textContent = "";
      });
    </script>
  </body>
</html>
